name = "hex0"
defaultTargets = ["Hex0", "Hex1", "LowIRCompile", "LowIRProgSim", "LowIRSSA"]

[[lean_lib]]
name = "Hex0"

[[lean_lib]]
name = "Hex1"

[[lean_lib]]
name = "LowIR"

# The executable D7/D8 compiler cut (Prog IR + Compile + differential tests).
# Rooted at the test module so `lake build LowIRCompile` checks the whole
# pipeline (the bare `LowIR` lib only builds its root module — see
# docs/RESUME-LOWIR-COMPILER.md on the globs trap).
[[lean_lib]]
name = "LowIRCompile"
roots = ["LowIR.CompileTests"]

# EXPERIMENT (2026-07-02): SSA variant of the Prog IR — valued outcomes,
# block-parameter loops, never/thru typing (docs/LOWIR-SSA-EXPERIMENT.md).
# Rooted at the Dump module (s-expression dumper), which transitively pulls
# the Lib module (strlen/hex0 ports + spec validation) and the core LowIR.SSA.
[[lean_lib]]
name = "LowIRSSA"
roots = ["LowIR.SSADump", "LowIR.SSAProof.ExecFacts", "LowIR.SSAProof.StrlenProof",
         "LowIR.SSAProof.Hex0Proof"]

# The compile_sim-for-Prog proof campaign (docs/RESUME-PROGSIM.md). Rooted at
# the Defs module for now (the top-level `LowIR.ProgSim.Main` with the payoff
# theorems arrives later — reroot then). Elaborates fast; stays in
# defaultTargets while it does (revisit if it crosses ~1 min — §5).
[[lean_lib]]
name = "LowIRProgSim"
roots = ["LowIR.ProgSim.Defs", "LowIR.ProgSim.SlotFacts", "LowIR.ProgSim.MemFacts", "LowIR.ProgSim.StmtSim", "LowIR.ProgSim.CtrlSim"]
